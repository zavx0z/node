name: Nodes Storybook Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: node-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nodes
        uses: actions/checkout@v6
        with:
          path: node

      - name: Check out Engine dependency
        uses: actions/checkout@v6
        with:
          repository: zavx0z/engine
          ref: ae461b8ab622d391247c714f3937f18bd5b4ae45
          path: engine

      - name: Check out UI dependencies
        uses: actions/checkout@v6
        with:
          repository: zavx0z/ui
          ref: 74f5e7a8d3defb06787b6975dd672f5c1cba89fc
          path: ui

      - name: Check out Layout dependency
        uses: actions/checkout@v6
        with:
          repository: zavx0z/layout
          ref: c97bc83b935ae1299c3db304c35483bb30f6de80
          path: layout

      - name: Check out Highlighter dependency
        uses: actions/checkout@v6
        with:
          repository: zavx0z/highlighter
          ref: a9f240b682a6ccec042ea04522220f153d3b53eb
          path: highlighter

      - name: Check out Storybook infrastructure dependency
        uses: actions/checkout@v6
        with:
          repository: zavx0z/storybook
          ref: bbacaa721b9327dc771f348f017bd6e0a7cef3df
          path: storybook

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: node/.bun-version

      - name: Register Engine link
        working-directory: engine/packages/core
        run: bun link

      - name: Register Layout link
        working-directory: layout/packages/core
        run: bun link

      - name: Register UI links
        run: |
          (cd ui/packages/elements && bun link)
          (cd ui/packages/components && bun link)

      - name: Install and verify Highlighter dependency
        working-directory: highlighter
        run: bun install --frozen-lockfile && bun run check

      - name: Register Highlighter link
        working-directory: highlighter
        run: bun link

      - name: Install Storybook infrastructure dependencies
        working-directory: storybook
        run: bun install --frozen-lockfile

      - name: Register Storybook infrastructure link
        working-directory: storybook
        run: bun link

      - name: Install Layout workspace
        working-directory: layout
        run: bun install --frozen-lockfile

      - name: Install UI workspace
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Install locked Nodes dependencies
        working-directory: node
        run: bun install --frozen-lockfile

      - name: Verify and build static Storybook
        working-directory: node
        run: bun run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Storybook artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: node/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
